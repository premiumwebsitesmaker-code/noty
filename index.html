<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forever Yours 💕</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #333;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: linear-gradient(135deg, #ffebee, #ffc1e3, #f8bbd0);
      position: relative;
    }

    /* Floating hearts (initial ones) */
    .hearts {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }
    .heart {
      position: absolute;
      font-size: 1.8rem;
      color: rgba(255, 105, 180, 0.7);
      animation: float 12s linear infinite;
      user-select: none;
    }

    @keyframes float {
      0%   { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.9; }
      90%  { opacity: 0.7; }
      100% { transform: translateY(-15vh) rotate(360deg); opacity: 0; }
    }

    /* New rising hearts & kisses after choice */
    .rising-emoji {
      position: absolute;
      bottom: -60px;
      font-size: 2.2rem;
      pointer-events: none;
      animation: rise 8s linear forwards;
      z-index: 3;
    }
    @keyframes rise {
      0%   { transform: translateY(0) rotate(0deg); opacity: 0.9; }
      10%  { opacity: 1; }
      100% { transform: translateY(-120vh) rotate(720deg); opacity: 0; }
    }

    video {
      position: fixed;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      transform: translateX(-50%) translateY(-50%);
      z-index: 0;
      object-fit: cover;
      opacity: 0.85;
      display: none; /* hidden until button click */
    }

    .content {
      max-width: 90%;
      padding: 40px 25px;
      background: rgba(255, 245, 247, 0.75);
      border-radius: 28px;
      backdrop-filter: blur(12px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.15);
      z-index: 2;
      opacity: 0;
      transition: opacity 1s ease;
    }

    h1 {
      font-size: 3.5rem;
      margin-bottom: 25px;
      color: #ff69b4;
    }

    p.main {
      font-size: 2.1rem;
      font-weight: 600;
      color: #c2185b;
      line-height: 1.4;
      margin: 30px 0;
    }

    .ring {
      font-size: 5rem;
      margin: 35px 0;
      animation: beat 2s infinite ease-in-out;
    }

    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.18); }
    }

    /* Popups */
    #lovePopup, #cheekyPopup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 182, 193, 0.92);
      color: #c2185b;
      font-size: 3.2rem;
      font-weight: bold;
      padding: 30px 55px;
      border-radius: 28px;
      box-shadow: 0 15px 50px rgba(0,0,0,0.3);
      z-index: 100;
      opacity: 0;
      transition: all 0.7s ease;
    }
    #lovePopup.show, #cheekyPopup.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.05);
    }

    .options {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 30px;
      flex-wrap: wrap;
    }
    .option-btn {
      background: #ff80ab;
      color: white;
      border: none;
      padding: 15px 38px;
      font-size: 1.4rem;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255, 64, 129, 0.4);
      transition: all 0.3s;
    }
    .option-btn:hover {
      transform: scale(1.12);
      background: #ff4081;
    }

    @media (max-width: 600px) {
      h1              { font-size: 2.6rem; }
      p.main          { font-size: 1.7rem; }
      .ring           { font-size: 4rem; }
      #lovePopup, #cheekyPopup { font-size: 2.4rem; padding: 25px 40px; }
      .option-btn     { font-size: 1.3rem; padding: 14px 30px; }
    }
  </style>
</head>
<body>

  <div class="hearts" id="hearts"></div>

  <video autoplay muted loop playsinline id="bgVideo">
    <source src="proposal-video.mp4" type="video/mp4">
    Your browser does not support video.
  </video>

  <div class="content" id="mainContent">
    <h1>My Sweetest Love 💕</h1>
    <p class="main">
      Will you be mine forever?<br>
      <span class="ring">💍</span>
    </p>
  </div>

  <!-- First popup -->
  <div id="lovePopup">I love you my bby 🐼</div>

  <!-- Second popup -->
  <div id="cheekyPopup">
    <div>Kab dogi? 👀</div>
    <div class="options">
      <button class="option-btn" onclick="chooseOption()">Jb aap bolo 🙈</button>
      <button class="option-btn" onclick="chooseOption()">Abhi lelo 🙈</button>
    </div>
  </div>

  <script>
    // Initial floating hearts
    const heartsContainer = document.getElementById('hearts');
    const heartSymbols = ['❤️', '💗', '💖', '💞', '💓', '🩷', '💕'];

    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDelay = Math.random() * 6 + 's';
      heartsContainer.appendChild(heart);
      setTimeout(() => heart.remove(), 15000);
    }
    setInterval(createHeart, 500);

    // Rising emojis after choice
    const emojis = ['💖', '💋', '❤️', '💕', '💗', '😘'];
    function createRisingEmoji() {
      const emoji = document.createElement('div');
      emoji.classList.add('rising-emoji');
      emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      emoji.style.left = Math.random() * 100 + 'vw';
      emoji.style.animationDuration = (6 + Math.random() * 5) + 's';
      document.body.appendChild(emoji);
      setTimeout(() => emoji.remove(), 13000);
    }

    // Popup logic
    const lovePopup = document.getElementById('lovePopup');
    const cheekyPopup = document.getElementById('cheekyPopup');
    const mainContent = document.getElementById('mainContent');
    const video = document.getElementById('bgVideo');

    // Show first popup
    setTimeout(() => lovePopup.classList.add('show'), 300);

    // Hide first → show main → show second popup
    setTimeout(() => {
      lovePopup.style.opacity = '0';
      lovePopup.style.transform = 'translate(-50%, -50%) scale(0.9)';
      
      setTimeout(() => {
        lovePopup.style.display = 'none';
        mainContent.style.opacity = '1';

        setTimeout(() => {
          cheekyPopup.classList.add('show');
        }, 1000); // thoda sa delay after proposal text

      }, 700);
    }, 3300); // 3 seconds + transition time

    // When any option is chosen
    function chooseOption() {
      cheekyPopup.style.opacity = '0';
      cheekyPopup.style.transform = 'translate(-50%, -50%) scale(0.9)';
      
      setTimeout(() => {
        cheekyPopup.style.display = 'none';
        
        // Start video
        video.style.display = 'block';
        video.play().catch(() => {});

        // Start rising hearts & kisses
        setInterval(createRisingEmoji, 400); // har 0.4 sec me ek emoji
      }, 600);
    }
  </script>

</body>
</html>
