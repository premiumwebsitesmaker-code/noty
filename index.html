<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forever Yours 💕</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #333;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: linear-gradient(135deg, #1a0011, #3d0026, #6a0044, #ffc1e3);
      background-size: 400% 400%;
      animation: bgShift 15s ease infinite;
      position: relative;
    }

    @keyframes bgShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ===== Floating Hearts Layer ===== */
    .hearts {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .heart {
      position: absolute;
      font-size: 1.8rem;
      color: rgba(255, 105, 180, 0.7);
      animation: float 12s linear infinite;
      user-select: none;
      filter: drop-shadow(0 0 6px rgba(255, 105, 180, 0.6));
    }

    @keyframes float {
      0%   { transform: translateY(100vh) rotate(0deg) scale(0.6); opacity: 0; }
      10%  { opacity: 0.9; }
      50%  { transform: translateY(40vh) rotate(180deg) scale(1.1); }
      90%  { opacity: 0.7; }
      100% { transform: translateY(-15vh) rotate(360deg) scale(0.6); opacity: 0; }
    }

    /* ===== Rising Emojis after choice ===== */
    .rising-emoji {
      position: absolute;
      bottom: -60px;
      font-size: 2.2rem;
      pointer-events: none;
      animation: rise 8s linear forwards;
      z-index: 3;
      filter: drop-shadow(0 0 8px rgba(255, 64, 129, 0.8));
    }

    @keyframes rise {
      0%   { transform: translateY(0) rotate(0deg) scale(0.5); opacity: 0.9; }
      10%  { opacity: 1; }
      50%  { transform: translateY(-60vh) rotate(360deg) scale(1.3); }
      100% { transform: translateY(-120vh) rotate(720deg) scale(0.5); opacity: 0; }
    }

    /* ===== Background Video ===== */
    video {
      position: fixed;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      transform: translateX(-50%) translateY(-50%);
      z-index: 0;
      object-fit: cover;
      opacity: 0.85;
      display: none;
      transition: opacity 1.5s ease;
    }

    /* ===== Content Card ===== */
    .content {
      max-width: 90%;
      padding: 50px 35px;
      background: rgba(255, 245, 247, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 32px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
      z-index: 2;
      opacity: 0;
      transform: scale(0.92) translateY(20px);
      transition: opacity 1.2s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 1.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .content.visible {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    h1 {
      font-size: 3.5rem;
      margin-bottom: 25px;
      background: linear-gradient(90deg, #ff69b4, #ff4081, #ff80ab, #ff69b4);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 3s linear infinite;
      filter: drop-shadow(0 2px 8px rgba(255, 64, 129, 0.4));
    }

    @keyframes shimmer {
      0%   { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    p.main {
      font-size: 2.1rem;
      font-weight: 600;
      color: #fff0f5;
      line-height: 1.5;
      margin: 30px 0;
      text-shadow: 0 2px 12px rgba(255, 64, 129, 0.6);
    }

    .ring {
      display: inline-block;
      font-size: 5rem;
      margin: 35px 0 10px;
      animation: beat 2s infinite ease-in-out;
      filter: drop-shadow(0 0 18px rgba(255, 215, 0, 0.9));
    }

    @keyframes beat {
      0%, 100% { transform: scale(1) rotate(0deg); }
      25%      { transform: scale(1.15) rotate(-5deg); }
      50%      { transform: scale(1.22) rotate(0deg); }
      75%      { transform: scale(1.15) rotate(5deg); }
    }

    /* ===== Sparkle ring around emoji ===== */
    .ring-wrap {
      position: relative;
      display: inline-block;
    }

    .ring-wrap::before,
    .ring-wrap::after {
      content: '✨';
      position: absolute;
      font-size: 1.6rem;
      animation: sparkle 1.8s ease-in-out infinite;
    }

    .ring-wrap::before {
      top: -10px;
      left: -25px;
      animation-delay: 0s;
    }

    .ring-wrap::after {
      bottom: -5px;
      right: -25px;
      animation-delay: 0.9s;
    }

    @keyframes sparkle {
      0%, 100% { opacity: 0.2; transform: scale(0.7) rotate(0deg); }
      50%      { opacity: 1; transform: scale(1.3) rotate(180deg); }
    }

    /* ===== Popups ===== */
    #lovePopup,
    #cheekyPopup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.7);
      background: linear-gradient(135deg, rgba(255, 182, 193, 0.95), rgba(255, 105, 180, 0.92));
      color: #fff;
      font-size: 3.2rem;
      font-weight: bold;
      padding: 35px 60px;
      border-radius: 32px;
      box-shadow:
        0 15px 50px rgba(255, 20, 100, 0.5),
        0 0 0 2px rgba(255, 255, 255, 0.3),
        inset 0 2px 10px rgba(255, 255, 255, 0.4);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: all 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
      text-shadow: 0 2px 12px rgba(180, 0, 60, 0.6);
      backdrop-filter: blur(8px);
    }

    #lovePopup.show,
    #cheekyPopup.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.05);
      pointer-events: auto;
    }

    /* Glowing pulse on popup */
    #lovePopup.show,
    #cheekyPopup.show {
      animation: glowPulse 2s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 15px 50px rgba(255, 20, 100, 0.5), 0 0 0 2px rgba(255, 255, 255, 0.3), inset 0 2px 10px rgba(255, 255, 255, 0.4); }
      50%      { box-shadow: 0 15px 70px rgba(255, 20, 100, 0.8), 0 0 0 4px rgba(255, 255, 255, 0.5), inset 0 2px 10px rgba(255, 255, 255, 0.4); }
    }

    /* ===== Options / Buttons ===== */
    .options {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 30px;
      flex-wrap: wrap;
    }

    .option-btn {
      position: relative;
      background: linear-gradient(135deg, #ff80ab, #ff4081);
      color: white;
      border: none;
      padding: 16px 42px;
      font-size: 1.4rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      box-shadow:
        0 6px 20px rgba(255, 64, 129, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.4);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      overflow: hidden;
    }

    .option-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      transition: left 0.6s ease;
    }

    .option-btn:hover::before {
      left: 100%;
    }

    .option-btn:hover {
      transform: scale(1.12) translateY(-3px);
      background: linear-gradient(135deg, #ff4081, #e91e63);
      box-shadow:
        0 10px 30px rgba(255, 64, 129, 0.7),
        inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }

    .option-btn:active {
      transform: scale(0.98) translateY(0);
    }

    /* ===== Floating Bokeh Circles ===== */
    .bokeh {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.15;
      background: radial-gradient(circle, #ff80ab, transparent 70%);
      animation: bokehFloat 20s ease-in-out infinite;
    }

    @keyframes bokehFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25%      { transform: translate(30px, -40px) scale(1.2); }
      50%      { transform: translate(-20px, 20px) scale(0.9); }
      75%      { transform: translate(40px, 30px) scale(1.1); }
    }

    /* ===== Responsive ===== */
    @media (max-width: 600px) {
      h1              { font-size: 2.6rem; }
      p.main          { font-size: 1.7rem; }
      .ring           { font-size: 4rem; }
      #lovePopup,
      #cheekyPopup    { font-size: 2.4rem; padding: 25px 40px; }
      .option-btn     { font-size: 1.3rem; padding: 14px 30px; }
      .content        { padding: 35px 20px; }
    }
  </style>
</head>
<body>

  <!-- Bokeh background circles -->
  <div class="bokeh" style="width:200px;height:200px;top:10%;left:5%;animation-delay:0s;"></div>
  <div class="bokeh" style="width:150px;height:150px;top:60%;right:8%;animation-delay:3s;"></div>
  <div class="bokeh" style="width:250px;height:250px;bottom:5%;left:15%;animation-delay:6s;"></div>
  <div class="bokeh" style="width:120px;height:120px;top:30%;right:25%;animation-delay:9s;"></div>
  <div class="bokeh" style="width:180px;height:180px;bottom:20%;right:5%;animation-delay:12s;"></div>

  <div class="hearts" id="hearts"></div>

  <video autoplay muted loop playsinline id="bgVideo">
    <source src="proposal-video.mp4" type="video/mp4">
    Your browser does not support video.
  </video>

  <div class="content" id="mainContent">
    <h1>My Sweetest Love 💕</h1>
    <p class="main">
      Will you be mine forever?<br>
      <span class="ring-wrap"><span class="ring">💍</span></span>
    </p>
  </div>

  <!-- First popup -->
  <div id="lovePopup">I love you my bby 🐼</div>

  <!-- Second popup -->
  <div id="cheekyPopup">
    <div>Kab dogi? 👀</div>
    <div class="options">
      <button class="option-btn" onclick="chooseOption()">Jb aap bolo 🙈</button>
      <button class="option-btn" onclick="chooseOption()">Abhi lelo 🙈</button>
    </div>
  </div>

  <script>
    // ===== Initial floating hearts =====
    const heartsContainer = document.getElementById('hearts');
    const heartSymbols = ['❤️', '💗', '💖', '💞', '💓', '🩷', '💕', '💝', '🩵'];

    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.fontSize = (1.2 + Math.random() * 1.6) + 'rem';
      heart.style.animationDelay = Math.random() * 6 + 's';
      heart.style.animationDuration = (8 + Math.random() * 8) + 's';
      heartsContainer.appendChild(heart);
      setTimeout(() => heart.remove(), 17000);
    }
    setInterval(createHeart, 450);

    // ===== Rising emojis after choice =====
    const emojis = ['💖', '💋', '❤️', '💕', '💗', '😘', '💞', '🩷', '💝', '🌹'];
    let emojiInterval = null;

    function createRisingEmoji() {
      const emoji = document.createElement('div');
      emoji.classList.add('rising-emoji');
      emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      emoji.style.left = Math.random() * 100 + 'vw';
      emoji.style.fontSize = (1.6 + Math.random() * 1.8) + 'rem';
      emoji.style.animationDuration = (6 + Math.random() * 5) + 's';
      document.body.appendChild(emoji);
      setTimeout(() => emoji.remove(), 13000);
    }

    // ===== Popup logic =====
    const lovePopup = document.getElementById('lovePopup');
    const cheekyPopup = document.getElementById('cheekyPopup');
    const mainContent = document.getElementById('mainContent');
    const video = document.getElementById('bgVideo');

    // Show first popup
    setTimeout(() => lovePopup.classList.add('show'), 300);

    // Hide first popup → show main content → show second popup
    setTimeout(() => {
      lovePopup.classList.remove('show');
      lovePopup.style.opacity = '0';
      lovePopup.style.transform = 'translate(-50%, -50%) scale(0.7)';

      setTimeout(() => {
        lovePopup.style.display = 'none';
        mainContent.classList.add('visible');

        setTimeout(() => {
          cheekyPopup.classList.add('show');
        }, 1200);

      }, 700);
    }, 3300);

    // ===== When any option is chosen =====
    function chooseOption() {
      cheekyPopup.classList.remove('show');
      cheekyPopup.style.opacity = '0';
      cheekyPopup.style.transform = 'translate(-50%, -50%) scale(0.7)';

      setTimeout(() => {
        cheekyPopup.style.display = 'none';

        // Start video with smooth fade-in
        video.style.display = 'block';
        video.style.opacity = '0';
        video.play().catch(() => {});

        // Fade video in
        requestAnimationFrame(() => {
          video.style.transition = 'opacity 1.5s ease';
          video.style.opacity = '0.85';
        });

        // Start rising hearts & kisses
        if (emojiInterval) clearInterval(emojiInterval);
        emojiInterval = setInterval(createRisingEmoji, 350);

        // Burst of emojis on click
        for (let i = 0; i < 15; i++) {
          setTimeout(createRisingEmoji, i * 80);
        }

      }, 600);
    }
  </script>

</body>
</html>
